<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Щоденник рибалки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app-container">
        
        <!-- Tab 1: Додати улов (Logbook) -->
        <div id="tab-log" class="tab-content active">
            <div class="glass-container">
                <header>
                    <div class="icon">🎣</div>
                    <h1>Додати улов</h1>
                    <p>Запишіть свої досягнення</p>
                </header>

                <form id="catch-form">
                    <div class="form-group">
                        <label for="species">Вид риби</label>
                        <select id="species" name="species" required>
                            <option value="" disabled selected>Оберіть рибу...</option>
                            <option value="Щука">Щука</option>
                            <option value="Короп">Короп</option>
                            <option value="Карась">Карась</option>
                            <option value="Окунь">Окунь</option>
                            <option value="Судак">Судак</option>
                            <option value="Лящ">Лящ</option>
                            <option value="Інша">Інша...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="weight">Вага (кг)</label>
                        <input type="number" id="weight" name="weight" step="0.1" min="0" placeholder="Наприклад, 1.5" required>
                    </div>

                    <div class="form-group">
                        <label for="bait">Наживка / Приманка</label>
                        <input type="text" id="bait" name="bait" placeholder="На що спіймали?" required>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">Зберегти улов</button>
                </form>
            </div>
        </div>

        <!-- Tab 2: Прогноз (Forecast) -->
        <div id="tab-forecast" class="tab-content">
            <div class="glass-container">
                <header>
                    <div class="icon">🌦</div>
                    <h1>Прогноз кльову</h1>
                    <p>Ідеальний час для риболовлі</p>
                </header>
                
                <div id="forecast-controls">
                    <button class="submit-btn location-btn" id="get-location-btn">📍 Визначити мою локацію</button>
                    <p class="or-text">- або -</p>
                    <div class="form-group">
                        <input type="text" id="city-input" placeholder="Введіть назву міста/села...">
                        <button class="submit-btn search-btn" id="search-city-btn">🔍 Шукати</button>
                    </div>
                </div>

                <div id="forecast-loading" style="display: none; text-align: center; padding: 20px;">
                    <div class="spinner">⏳</div>
                    <p>Збираємо погодні дані...</p>
                </div>

                <div id="forecast-results" style="display: none;">
                    <div class="weather-widget">
                        <div class="weather-row">
                            <div class="weather-item">
                                <span class="w-icon">🌡</span>
                                <span class="w-val" id="res-temp">--°C</span>
                            </div>
                            <div class="weather-item">
                                <span class="w-icon">💨</span>
                                <span class="w-val" id="res-wind">-- м/с</span>
                            </div>
                            <div class="weather-item">
                                <span class="w-icon">⏱</span>
                                <span class="w-val" id="res-pressure">-- мм рт.ст.</span>
                            </div>
                        </div>
                        
                        <div class="score-card">
                            <h3>Оцінка умов</h3>
                            <div class="score-circle">
                                <span id="res-score">10</span><small>/10</small>
                            </div>
                        </div>

                        <div class="advice-box" id="res-advice">
                            <!-- Advice lines will be appended here -->
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="tab-log">
            <span class="nav-icon">📝</span>
            <span class="nav-text">Щоденник</span>
        </a>
        <a href="#" class="nav-item" data-target="tab-forecast">
            <span class="nav-icon">🌤</span>
            <span class="nav-text">Прогноз</span>
        </a>
    </nav>

    <script src="app.js?v=3"></script>
</body>
</html>
